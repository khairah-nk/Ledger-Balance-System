<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Balance System</title>

  <!-- Issue #5 The style sheet file name is without the letter "s" at the end. -->
  <!-- <link rel="stylesheet" href="style.css"> -->
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Issue #6 The filename ledger mispelled. -->
    <!-- <img src="ledgerr.png" alt="Ledger Header"> -->
     <img src="ledger.png" alt="Ledger Header">
    <h1>Ledger Balance System</h1>
    <p id="greeting"></p>
    <div class="form">
      <label>Salary:       <input type="number" id="salary" placeholder="0"></label>
      <label>Food:         <input type="number" id="food" placeholder="0"></label>
      <label>Rent:         <input type="number" id="rent" placeholder="0"></label>
      <label>Others:       <input type="number" id="others" placeholder="0"></label>
      <label>Saving Goal:  <input type="number" id="saving" placeholder="0"></label>
    </div>
    <!-- Issue # adding id to calculate button to be able to select it in the script.js file. -->
    <!-- <button>Calculate Balance</button> -->
    <button id="calculate">Calculate Balance</button>
    <div id="result" class="result"></div>
  </div>
  <!-- Issue #8 module is rewuired to be imported in the script.js file. -->
  <!-- <script src="script.js"></script> -->
   <script type="module" src="script.js"></script>
</body>
</html>
